<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>birloto.com | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="admin">
  <div class="background-glow"></div>
  <header class="site-header compact-header">
    <div class="brand-block small">
      <span class="brand-chip">Admin Console</span>
      <h1 class="brand-title">birloto.com</h1>
    </div>
    <nav class="top-nav">
      <a href="/index.html" class="nav-link">Lobby</a>
      <a href="/game.html" class="nav-link">Oyun</a>
      <a href="/dashboard.html" class="nav-link">Panel</a>
      <a href="/admin.html" class="nav-link active">Admin</a>
      <button id="logoutButton" class="nav-link nav-button">Çıxış</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="dashboard-grid four-columns">
      <article class="panel-card stat-card"><div id="statUsers" class="mini-stat loading-card">Yüklənir...</div></article>
      <article class="panel-card stat-card"><div id="statTickets" class="mini-stat loading-card">Yüklənir...</div></article>
      <article class="panel-card stat-card"><div id="statSales" class="mini-stat loading-card">Yüklənir...</div></article>
      <article class="panel-card stat-card"><div id="statPayout" class="mini-stat loading-card">Yüklənir...</div></article>
    </section>

    <section class="dashboard-grid two-columns">
      <article class="panel-card">
        <div class="panel-header">
          <h2>Platforma ayarları</h2>
        </div>
        <form id="settingsForm" class="admin-form">
          <div class="form-grid two-columns-form">
            <label><span>Bilet qiyməti</span><input type="number" name="ticketPrice" min="1" required></label>
            <label><span>Welcome bonus</span><input type="number" name="welcomeBonus" min="0" required></label>
            <label><span>Başlanğıc balansı</span><input type="number" name="startingBalance" min="0" required></label>
            <label><span>Bir sıra multiplier</span><input type="number" name="rowMultiplier" min="1" required></label>
            <label><span>İki sıra multiplier</span><input type="number" name="twoRowMultiplier" min="1" required></label>
            <label><span>Full House multiplier</span><input type="number" name="fullHouseMultiplier" min="1" required></label>
            <label><span>Auto draw interval ms</span><input type="number" name="autoDrawIntervalMs" min="500" step="100" required></label>
            <label><span>Self start</span>
              <select name="allowSelfStart">
                <option value="true">Aktiv</option>
                <option value="false">Yalnız admin</option>
              </select>
            </label>
          </div>
          <button type="submit" class="gold-button">Ayarları yadda saxla</button>
        </form>
      </article>

      <article class="panel-card">
        <div class="panel-header">
          <h2>İstifadəçiyə balans əlavə et</h2>
        </div>
        <form id="creditForm" class="admin-form">
          <label><span>İstifadəçi ID</span><input type="number" name="userId" min="1" required></label>
          <label><span>Məbləğ</span><input type="number" name="amount" min="1" required></label>
          <label><span>Balans növü</span>
            <select name="type">
              <option value="balance">Əsas balans</option>
              <option value="bonus">Bonus balansı</option>
            </select>
          </label>
          <button type="submit" class="gold-button">Əlavə et</button>
        </form>
        <div class="panel-header lower-space">
          <h2>JSON export</h2>
        </div>
        <a href="/api/admin/export" target="_blank" class="ghost-button full-width">Export aç</a>
      </article>
    </section>

    <section class="dashboard-grid two-columns">
      <article class="panel-card">
        <div class="panel-header">
          <h3>İstifadəçilər</h3>
        </div>
        <div id="adminUsers" class="table-shell loading-card">
          <p>İstifadəçilər yüklənir...</p>
        </div>
      </article>

      <article class="panel-card">
        <div class="panel-header">
          <h3>Raundlar</h3>
        </div>
        <div id="adminDraws" class="history-list loading-card">
          <p>Raundlar yüklənir...</p>
        </div>
      </article>
    </section>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/script.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
