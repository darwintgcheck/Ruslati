<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>birloto.com | Qeydiyyat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="register">
  <div class="background-glow"></div>
  <main class="auth-shell">
    <section class="auth-card">
      <a href="/index.html" class="back-link">← Lobby-yə qayıt</a>
      <div class="section-badge">Yeni hesab</div>
      <h1>Qeydiyyat</h1>
      <p class="auth-copy">Yeni hesab yaradın, demo balansı və bonus alın, Russian Loto biletlərini satın.</p>
      <form id="registerForm" class="auth-form">
        <label>
          <span>İstifadəçi adı</span>
          <input type="text" name="username" minlength="3" placeholder="Ən azı 3 simvol" required>
        </label>
        <label>
          <span>Şifrə</span>
          <input type="password" name="password" minlength="6" placeholder="Ən azı 6 simvol" required>
        </label>
        <button type="submit" class="gold-button full-width">Hesab yarat</button>
      </form>
      <div class="auth-footer">
        <p>Artıq hesabınız var? <a href="/login.html">Giriş edin</a></p>
      </div>
      <div id="authMessage" class="inline-message"></div>
    </section>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script src="/script.js"></script>
</body>
</html>
